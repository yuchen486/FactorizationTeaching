<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" role="img" aria-label="提公因式法板书"><rect width="1500" height="800" fill="#123b32"/><text x="65" y="85" fill="#fff8df" font-size="47" font-family="SimSun,serif">因式分解——提公因式法</text><path d="M65 115H1435M440 155V595M970 155V595M65 625H1435" fill="none" stroke="#8db9a3" stroke-width="2"/><text data-step="1" x="65" y="175" fill="#f5d676" font-size="32" font-family="Times New Roman,SimSun,serif">概念与依据</text><text data-step="1" x="65" y="240" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">ab＋ac＝a(b＋c)</text><text data-step="1" x="65" y="300" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">多项式 → 整式的积</text><text data-step="1" x="65" y="360" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">依据：乘法分配律</text><text data-step="2" x="480" y="175" fill="#f5d676" font-size="32" font-family="Times New Roman,SimSun,serif">例题 E03</text><text data-step="2" x="480" y="235" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">6x²＋9x</text><text data-step="3" x="480" y="295" fill="#f5d676" font-size="32" font-family="Times New Roman,SimSun,serif">公因式：3x</text><text data-step="4" x="480" y="355" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">＝3x·2x＋3x·3</text><text data-step="5" x="480" y="415" fill="#f5d676" font-size="32" font-family="Times New Roman,SimSun,serif">＝3x(2x＋3)</text><text data-step="6" x="480" y="485" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">检验：展开还原原式</text><text data-step="7" x="1010" y="175" fill="#f5d676" font-size="32" font-family="Times New Roman,SimSun,serif">辨析 E04</text><text data-step="7" x="1010" y="235" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">3x²＋3x</text><text data-step="8" x="1010" y="295" fill="#f5d676" font-size="32" font-family="Times New Roman,SimSun,serif">＝3x(x＋1)</text><text data-step="8" x="1010" y="355" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">3x＝3x·1</text><text data-step="9" x="1010" y="435" fill="#f5d676" font-size="32" font-family="Times New Roman,SimSun,serif">检测 E05</text><text data-step="9" x="1010" y="495" fill="#f2f7ef" font-size="32" font-family="Times New Roman,SimSun,serif">8a²－12a</text><text data-step="10" x="1010" y="555" fill="#f5d676" font-size="32" font-family="Times New Roman,SimSun,serif">＝4a(2a－3)</text><text data-step="11" x="65" y="680" fill="#f5d676" font-size="38" font-family="Times New Roman,SimSun,serif">找公因式　→　逐项确定商式　→　乘回检验</text></svg>